<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HangIt - Dominio de la Conjugación Verbal</title>
    <meta name="description" content="Videojuego educativo móvil tipo ahorcado para evaluar el dominio de la conjugación verbal en inglés." />
    <meta property="og:title" content="HangIt - Dominio de la Conjugación Verbal" />
    <meta property="og:description" content="Videojuego educativo móvil tipo ahorcado para evaluar el dominio de la conjugación verbal en inglés." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="mobile-screen" id="app">
      <!-- VISTA 1: MENÚ DE CATEGORÍAS (HU-06) -->
      <section id="pantalla-categorias" class="pantalla-vista" aria-label="Menú de categorías">
        <!-- CA 6.2: Barra superior azul oscuro con 'Categorías' centrado -->
        <header class="barra-superior-centrada" role="banner">
          <h1 class="etiqueta-barra-centrada">Categorías</h1>
        </header>

        <div class="contenido-vista">
          <!-- CA 6.3 & CA 6.4: Tarjeta de categoría 'Presente continuo' -->
          <button id="tarjeta-categoria-presente-continuo" class="tarjeta-categoria" type="button">
            Presente continuo
          </button>
        </div>
      </section>

      <!-- VISTA 2: DETALLE DE CATEGORÍA (HU-07 & HU-08) -->
      <section id="pantalla-detalle-categoria" class="pantalla-vista oculto" aria-label="Detalle de categoría">
        <!-- CA 7.2 & CA 7.3: Barra superior con nombre de categoría y botón de retroceso -->
        <header class="barra-superior-centrada" role="banner">
          <button id="boton-retroceso" class="boton-retroceso" type="button" aria-label="Volver a categorías">
            ←
          </button>
          <h1 id="titulo-detalle-categoria" class="etiqueta-barra-centrada">Presente continuo</h1>
        </header>

        <div class="contenido-vista">
          <!-- CA 7.4: Tarjeta central con 'Ronda 1 de 3' -->
          <div class="tarjeta-ronda">
            <span class="texto-ronda">Ronda 1 de 3</span>
          </div>

          <!-- CA 8.1: Botón Jugar centrado en el borde inferior -->
          <div class="contenedor-boton-inferior">
            <button id="boton-jugar" class="boton-primario" type="button">
              Jugar
            </button>
          </div>
        </div>
      </section>

      <!-- VISTA 3: PANTALLA DE JUEGO (Heredada del Sprint 1 con correcciones BUG-01, BUG-02 y BUG-03) -->
      <section id="pantalla-juego" class="pantalla-vista oculto" aria-label="Pantalla de juego">
        <!-- CA 5.2 / CA 8.3: Barra superior del juego -->
        <header class="barra-superior" role="banner">
          <span id="etiqueta-ronda" class="etiqueta-ronda">Ronda 1</span>
          <span id="etiqueta-reactivo" class="etiqueta-reactivo">Reactivo 1 de 5</span>
        </header>

        <div class="contenido-juego">
          <!-- CA 5.3: Contador de intentos restantes -->
          <div id="franja-intentos" class="franja-intentos" aria-live="polite">
            Intentos restantes: 7 de 7
          </div>

          <!-- CA 5.4: Tarjeta central con la oración incompleta -->
          <section class="tarjeta-oracion" aria-label="Oración a completar">
            <p id="texto-oracion" class="texto-oracion"></p>
          </section>

          <!-- CA 5.5: Línea de letras ya utilizadas -->
          <div id="etiqueta-letras-usadas" class="etiqueta-letras-usadas">
            Letras usadas: -
          </div>

          <!-- CA 5.6 & CA 5.7: Caja de texto para un carácter -->
          <input
            id="caja-letra"
            class="caja-letra"
            type="text"
            maxlength="1"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
            aria-label="Caja de letra"
          />

          <!-- CA 5.8: Botón comprobar jugada -->
          <button id="boton-comprobar" class="boton-comprobar" type="button">
            Comprobar
          </button>

          <!-- CA 5.9: Área de avisos con altura fija reservada -->
          <div id="area-avisos" class="area-avisos aviso-vacio" role="alert" aria-live="assertive"></div>

          <!-- Botón Siguiente Reactivo (solo para reactivos 1 al 4; en reactivo 5 se suprime por BUG-01 / CA 8.5) -->
          <div class="contenedor-siguiente">
            <button id="boton-siguiente" class="boton-siguiente oculto" type="button">
              Siguiente reactivo
            </button>
          </div>
        </div>
      </section>

      <!-- VISTA 4: PANTALLA DE RESUMEN (HU-17) -->
      <section id="pantalla-resumen" class="pantalla-vista oculto" aria-label="Resumen de la ronda">
        <!-- CA 17.2: Barra superior azul oscuro con 'Resumen de la ronda' centrado -->
        <header class="barra-superior-centrada" role="banner">
          <h1 class="etiqueta-barra-centrada">Resumen de la ronda</h1>
        </header>

        <div class="contenido-vista">
          <!-- CA 17.3 & CA 17.5: Tarjeta superior central con total de fallos -->
          <div class="tarjeta-resumen-total">
            <p id="texto-resumen-total" class="texto-resumen-total"></p>
            <p id="texto-resumen-exito" class="texto-resumen-exito oculto">¡Completaste todos los reactivos!</p>
          </div>

          <!-- CA 17.4: Lista de reactivos fallados con el verbo en mayúscula entre paréntesis -->
          <div id="contenedor-fallados" class="contenedor-fallados oculto">
            <h2 class="etiqueta-fallados">Reactivos fallados:</h2>
            <ul id="lista-reactivos-fallados" class="lista-reactivos-fallados"></ul>
          </div>

          <!-- CA 17.6: Botón Volver al menú en el borde inferior -->
          <div class="contenedor-boton-inferior">
            <button id="boton-volver-menu" class="boton-primario" type="button">
              Volver al menú
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Módulo de lógica del juego -->
    <script type="module" src="/script.js"></script>
  </body>
</html>
